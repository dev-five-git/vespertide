# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # NCSA (University of Illinois/NCSA Open Source License) — permissive,
    # required only by `libfuzzer-sys` (`(MIT OR Apache-2.0) AND NCSA`), a
    # dev-only dependency of the `vespertide-fuzz` cargo-fuzz harness.
    "NCSA",
    # MIT-0 (MIT No Attribution) — permissive, OSI-approved. Required by
    # `borrow-or-share` (via `fluent-uri` → `tower-lsp-server`).
    "MIT-0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Disallow direct dependency on OpenSSL — prefer rustls / native-tls boundary
    # Comment out if the project intentionally uses openssl.
]

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
