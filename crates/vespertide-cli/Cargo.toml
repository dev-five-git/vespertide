[package]
name = "vespertide-cli"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "CLI command for vespertide (model template, diff, SQL, revision, status, log)"
keywords = ["database", "migration", "schema", "orm", "sql"]
categories = ["database"]
readme = "../../README.md"
publish = true

[dependencies]
rayon = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
colored = "3"
strsim = "0.11"
dialoguer = "0.12"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
futures = "0.3"
async-recursion = "1"
dot-writer = "0.1.4"
vespertide-config = { workspace = true, features = ["cli", "schema"] }
vespertide-core = { workspace = true, features = ["schema"] }
vespertide-loader = { workspace = true }
vespertide-planner = { workspace = true }
vespertide-query = { workspace = true }
vespertide-exporter = { workspace = true }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
rstest = "0.26"
assert_cmd = "2"
predicates = "3"
insta = "1.47"

[[bin]]
name = "vespertide"
path = "src/main.rs"

[lints]
workspace = true
