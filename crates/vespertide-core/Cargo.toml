[package]
name = "vespertide-core"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Data models for tables, columns, constraints, indexes, and migration actions"
keywords = ["database", "migration", "schema", "orm", "sql"]
categories = ["database"]
readme = "../../README.md"

[dependencies]
proptest = { version = "1", optional = true, default-features = false, features = ["std", "bit-set"] }
serde = { version = "1", features = ["derive"] }
sea-orm = { version = "2.0.0-rc.40", default-features = false }
schemars = { version = "1.2", optional = true }
thiserror = "2"
vespertide-naming = { workspace = true }

[features]
arbitrary = ["dep:proptest"]
default = ["schema"]
schema = ["dep:schemars"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"
rstest = "0.26"
serde_json = "1"

[[bench]]
name = "normalize_benchmarks"
harness = false

[lints]
workspace = true
