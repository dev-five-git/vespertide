[package]
name = "vespertide-exporter"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Export vespertide table definitions into ORM-specific models"
keywords = ["database", "migration", "schema", "orm", "sql"]
categories = ["database"]
readme = "../../README.md"

[dependencies]
rayon = { workspace = true }
vespertide-core = { workspace = true }
vespertide-config = { workspace = true }
vespertide-naming = { workspace = true }
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }

[features]
cli = ["dep:clap"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
rstest = "0.26"
insta = { version = "1.48", features = ["yaml"] }
proptest = "1"
vespertide-core = { workspace = true, features = ["arbitrary"] }

[[bench]]
name = "codegen_benchmarks"
harness = false

[lints]
workspace = true
